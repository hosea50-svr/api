   {% extends "base.html" %}
   {% block content %}
 <style>
    .container{
        background-color: whitesmoke;
        padding: 40px;
        margin: 0 auto;
        max-width: 400px;
        font-family: sans-serif,arial;
    }
    input{
        border: 0;
        border-radius: 3px;
        padding: 8px;
    }
    input[type="file"]{
        border: 0;
        border-radius: 3px;
        padding: 8px;
        background-color: gray;
        font-weight: bold;
    }
    button{
        background-color: rgb(71, 206, 71);
        padding: 8px;
        border: 0;
        color: white;
        border-radius: 3px;
        font-weight: bold;
    }
    textarea{
        width: 100%;
        padding: 10px;
        font-size: 14px;
        border: 0;
        min-height: 120px;
        border-radius: 3px;
    }
    h2{
        color: rgb(199, 176, 48);
    }

    .animated-bg {
    min-height: 100vh;
    background: linear-gradient(-45deg, #1e3c72, #2a5298, #00c6ff, #0072ff);
    background-size: 400% 400%;
    animation: gradientMove 10s ease infinite;
    display: flex;
    justify-content: center;
    align-items: center;
    }

    @keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
    }
</style>
<div class="animated-bg">
    <div class="container">
          <h2>Update blog post</h2>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Submit</button>
        <a class="btn btn-secondary" href="{% url 'test' %}">
            Back
        </a>
    </form> 
</div>
      
</div>
{% endblock content %}
